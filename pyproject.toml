[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "past-mri"
version = "0.1.0"
description = "Unpaired anatomical pretraining followed by paired multi-field MRI translation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PAST-MRI Authors"}]
dependencies = [
  "numpy>=1.24",
  "nibabel>=5.0",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "lpips>=0.1.4",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["past_mri*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
